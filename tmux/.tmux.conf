set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Forward Codex notification bells to the outer terminal.
set -g visual-bell off
set -g bell-action any
set -g monitor-bell on

# Move to another panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Preserve current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Equal pane sizes
bind = select-layout tiled

# Synchronize all pances
bind y set-window-option synchronize-panes

# Page up/down with Option+Arrow while in copy mode (scroll)
bind-key -T copy-mode M-Up send-keys -X page-up
bind-key -T copy-mode M-Down send-keys -X page-down
bind-key -T copy-mode-vi M-Up send-keys -X page-up
bind-key -T copy-mode-vi M-Down send-keys -X page-down

# Status bar
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 40
set -g status-left "#[fg=colour235,bg=colour110,bold] #{=/30/…:session_name} #[default] "
set -g status-right-length 40
set -g status-right "#[fg=colour245] %m-%d %H:%M "
set -g window-status-format "#[fg=colour245] #I:#{?#{allow-set-title},#W,#{=/20/…:pane_title}} "
set -g window-status-current-format "#[fg=colour235,bg=colour180,bold] #I:#{?#{allow-set-title},#W,#{=/20/…:pane_title}} "
set -g window-status-separator ""

# Rename session/window/pane with prefix S/W/P.
# Popup shells let the terminal's IME compose Hangul normally (tmux's own prompt splits jamo).
bind S display-popup -E -w 50 -h 3 -T " rename session " \
  'zsh -c "bindkey -e; name=\$(tmux display -p \"#S\"); vared -p \"› \" name && [[ -n \$name ]] && tmux rename-session -- \"\$name\""'
# Window rename disables automatic-rename (empty name restores it)
bind W display-popup -E -w 50 -h 3 -T " rename window " \
  'zsh -c "bindkey -e; w=\$(tmux display -p \"#{window_id}\"); name=\$(tmux display -p \"#W\"); vared -p \"› \" name || exit; if [[ -n \$name ]]; then tmux rename-window -t \$w -- \"\$name\"; else tmux set -w -t \$w -u automatic-rename; fi"'

# Pane titles on the top border (hidden while the title is still the default hostname)
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour110#,bold],#[fg=colour245]}#P#{?#{==:#{pane_title},#{host}},, #{pane_title}} "

# Pane rename locks the title so programs cannot overwrite it (empty name unlocks)
bind P display-popup -E -w 50 -h 3 -T " rename pane " \
  'zsh -c "bindkey -e; p=\$(tmux display -p \"#{pane_id}\"); h=\$(tmux display -p \"#{host}\"); name=\$(tmux display -p -t \$p \"#{pane_title}\"); [[ \$name == \$h ]] && name=; vared -p \"› \" name || exit; if [[ -n \$name ]]; then tmux select-pane -t \$p -T \"\$name\" \\; set -p -t \$p allow-set-title off; else tmux set -p -t \$p -u allow-set-title \\; select-pane -t \$p -T \"\$h\"; fi"'
